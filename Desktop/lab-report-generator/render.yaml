# Render Blueprint — defines the backend web service.
# Push this repo to GitHub, then on Render: New + > Blueprint > select repo.
# Render reads this file automatically and sets everything up.

services:
  - type: web
    name: lab-report-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"   # tighten this to your actual frontend URL after first deploy
      - key: COMPILE_TIMEOUT_SECONDS
        value: "40"
      - key: COMPILE_PASSES
        value: "2"
    healthCheckPath: /health
